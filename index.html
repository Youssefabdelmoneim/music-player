<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script type="module" src="controllers/logic.js"></script>
    <link rel="stylesheet" href="sass/style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MusicHub</title>
  </head>
  <body>
    <header>
      <form class="searchBar">
        <button class="searchBtn">
          <svg
            xmlns="http://w3.org"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            style="color: #ffffff; display: block"
          >
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>
        <input
          type="text"
          placeholder="Songs, albums, artists"
          class="search"
        />
      </form>
    </header>
    <div class="home"></div>
    <div class="player hidden"></div>
    <div class="searchList hidden"></div>
  </body>
</html>
